
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marching Band Percussion Checker</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        body {
            background-color: #800020;
            color: #f0c040;
            font-family: 'Gill Sans', sans-serif;
            text-align: center;
            margin: 0;
        }

        header {
            background-color: #f0c040;
            color: #800020;
            padding: 40px 20px;
            border-bottom: 6px solid #d4a017;
        }

        h1 {
            font-family: 'Gill Sans', sans-serif;
            font-weight: 800;
        }

        main {
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            background-color: white;
            border: 2px solid #d4a017;
            border-radius: 12px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #800020;
            border-radius: 6px;
        }

        input[type="button"] {
            background-color: #800020;
            color: #f0c040;
            border: none;
            padding: 10px 30px;
            margin-top: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        input[type="button"]:hover {
            background-color: #a52a2a;
            color: white;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
            color: #800020;
        }

        .reactor {
            width: 20px;
            height: 20px;
            background-color: #f0c040;
            border-radius: 50%;
            margin: 0 auto 10px;
        }

        /* Navigation Bar */
        .navbar {
            background-color: #800020;
            padding: 15px 30px;
            border-bottom: 5px solid #d4a017;
        }

        .navbar-brand {
            color: #f0c040 !important;
            font-size: 22px;
            font-weight: 800;
        }

        .navbar-nav .nav-link {
            color: #f0c040 !important;
            font-size: 17px;
            font-weight: bold;
            margin-left: 15px;
            transition: 0.3s;
        }

        .navbar-nav .nav-link:hover {
            color: white !important;
        }

        .navbar-toggler {
            border: 1px solid #f0c040;
        }

        .navbar-toggler-icon {
            filter: brightness(0) invert(1);
        }

        /* Responsive Design */
        @media (max-width: 576px) {
            main {
                margin: 30px 20px;
            }

            header {
                padding: 30px 15px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">

            <a class="navbar-brand" href="mainpage.html">
                Marching Band
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="mainpage.html">
                            Main Page
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="checker.html">
                            Percussion Checker
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="creator.html">
                            Meet the Creator
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Logout
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>

    <!-- Header -->
    <header>
        <div class="reactor"></div>

        <h1>Percussion Instrument Checker</h1>

        <p>Enter a marching band percussion instrument to learn more about it!</p>
    </header>

    <!-- Main Content -->
    <main>

        <form onsubmit="return false;">

            <input type="text"
                id="elementInput"
                placeholder="Enter a percussion instrument">

            <br>

            <input type="button"
                py-click="instrument_info"
                value="Check Instrument">

        </form>

        <div id="result"></div>

    </main>

    <!-- PyScript -->
    <script type="py" src="main.py"></script>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
